<!DOCTYPE html>
<html lang="en" prefix="og: http://ogp.me/ns#">

<head>
  <meta charset="UTF-8" />
  <title>Firefuel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Documentation for Firefuel: a typed, testable data layer for Flutter and Cloud Firestore." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Firefuel" />
  <meta property="og:description"
    content="Documentation for Firefuel: a typed, testable data layer for Flutter and Cloud Firestore." />
  <meta property="og:image" content="http://firefueldocs.com/assets/firefuel_logo.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />

  <!--
    Every script and stylesheet is pinned to an exact version. Until 2026-09 the
    plugins were loaded unversioned from unpkg, so any plugin's next major release
    could break this site without a commit here.
  -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/core.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/addons/core-dark.min.css"
    media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="assets/style.css" />
</head>

<body>
  <div id="app">Fueling up…</div>
  <script>
    window.$docsify = {
      name: "Firefuel",
      repo: "https://github.com/SupposedlySam/firefuel",
      homepage: "README.md",
      loadSidebar: true,
      coverpage: true,
      auto2top: true,
      subMaxLevel: 3,
      maxLevel: 4,
      search: {
        paths: "auto",
        placeholder: "Search",
        noData: "No results.",
        depth: 3,
      },
      plugins: [
        // The footer used to come from @alertbox/docsify-footer, unmaintained
        // since 2020. It is one paragraph, so it lives here.
        function footer(hook) {
          hook.afterEach(function (html) {
            return (
              html +
              '<footer class="firefuel-footer">Made with 💙 by ' +
              '<a href="https://github.com/SupposedlySam/firefuel/blob/main/AUTHORS">the Firefuel community</a>. ' +
              '<a href="https://github.com/sponsors/SupposedlySam">Become a sponsor</a> 💖</footer>'
            );
          });
        },
      ],
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/plugins/emoji.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-dart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-json.min.js"></script>
</body>

</html>
