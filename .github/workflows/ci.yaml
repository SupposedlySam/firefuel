# Verifies every workspace member. It never publishes and never deploys:
# the docs site is served by GitHub Pages straight from /docs on main.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
        with:
          path: .fvmrc

      - name: Resolve the workspace
        run: flutter pub get

      - name: Format
        run: >-
          dart format --output=none --set-exit-if-changed
          packages/firefuel/lib packages/firefuel/test
          packages/firefuel/example/lib packages/firefuel/example/test
          packages/firefuel_core
          packages/firefuel_integration/integration_test
          packages/firefuel_integration/test

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: No null assertions in library code
        run: tool/check_null_assertions.sh

      - name: Test firefuel_core
        working-directory: packages/firefuel_core
        run: dart test

      - name: Test firefuel
        working-directory: packages/firefuel
        run: flutter test

      - name: Test example
        working-directory: packages/firefuel/example
        run: flutter test

      - name: Check the real-Firestore suite covers every test file
        working-directory: packages/firefuel_integration
        run: flutter test test

      - name: Publish dry run
        run: |
          (cd packages/firefuel_core && dart pub publish --dry-run)
          (cd packages/firefuel && flutter pub publish --dry-run)

  # The same firefuel test files, against the Firestore emulator instead of
  # fake_cloud_firestore. cloud_firestore has no Linux desktop support, so this
  # runs on macOS.
  real-firestore:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
        with:
          path: .fvmrc

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools

      - name: Resolve the workspace
        run: flutter pub get

      - name: Run firefuel's tests against the Firestore emulator
        run: tool/test_real_firestore.sh
