name: firefuel
description: A Firebase Cloud Firestore library to fuel your application's growth!
version: 0.5.0
repository: https://github.com/SupposedlySam/firefuel/tree/main/packages/firefuel
homepage: https://github.com/SupposedlySam/firefuel
documentation: https://firefueldocs.com

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

resolution: workspace

dependencies:
  cloud_firestore: ^6.10.0
  # 3.x removed EquatableMixin and runtimeType comparison; neither is relied on
  # (see the equality tests). 2.1 is resolved here because fake_cloud_firestore
  # still requires it.
  equatable: ">=2.1.0 <4.0.0"
  firefuel_core: ^0.2.0
  flutter:
    sdk: flutter
  stack_trace: ^1.12.2

dev_dependencies:
  async: ^2.13.0
  fake_cloud_firestore: ^4.3.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

import_sorter:
  comments: false

scripts: ../../derry.yaml
