name: firefuel
description: A Firebase Cloud Firestore library to fuel your application's growth!
version: 0.4.7
repository: https://github.com/SupposedlySam/firefuel/tree/main/packages/firefuel
homepage: https://github.com/SupposedlySam/firefuel
documentation: https://firefueldocs.com

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

resolution: workspace

dependencies:
  cloud_firestore: ^6.3.0
  equatable: ^2.0.8
  firefuel_core: ^0.1.7
  flutter:
    sdk: flutter
  stack_trace: ^1.12.1

dev_dependencies:
  fake_cloud_firestore: ^4.3.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

import_sorter:
  comments: false

scripts: ../../derry.yaml
