name: firefuel_core
description: Pure-Dart types for firefuel (Serializable, DocumentId, Failure, Either, FieldUpdate), with no Flutter or Firestore dependency.
version: 0.2.0
repository: https://github.com/SupposedlySam/firefuel/tree/main/packages/firefuel_core

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  # 3.x removed EquatableMixin and runtimeType comparison; neither is relied on
  # (see the equality tests). 2.1 is resolved here because fake_cloud_firestore
  # still requires it.
  equatable: ">=2.1.0 <4.0.0"
  meta: ^1.16.0
  stack_trace: ^1.12.2

dev_dependencies:
  test: ^1.31.0

import_sorter:
  comments: false

scripts: ../../derry.yaml
